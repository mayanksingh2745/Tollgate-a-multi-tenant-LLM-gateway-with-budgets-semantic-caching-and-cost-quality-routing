[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate-monorepo"
version = "0.1.0"
description = "Multi-tenant LLM gateway with budgets, semantic caching, and cost-quality routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    "pgvector>=0.2.5",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-client>=0.20.0",
    "urllib3>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.3",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "aiosqlite>=0.20.0",
    "pip-audit>=2.7.0",
    "openai>=1.0.0"
]

[tool.setuptools]
packages = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = ["E501", "E402", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = false
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disable_error_code = ["var-annotated", "attr-defined", "operator", "arg-type", "union-attr", "str-unpack", "return-value", "assignment", "str-bytes-safe"]
exclude = ["build", "dist", "migrations"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
