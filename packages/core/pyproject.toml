[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate-core"
version = "0.1.0"
description = "Core shared library for Tollgate gateway and worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "redis>=5.0.3",
    "argon2-cffi>=23.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
