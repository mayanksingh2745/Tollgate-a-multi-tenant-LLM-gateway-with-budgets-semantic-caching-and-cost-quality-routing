user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting zone for burst protection
    limit_req_zone $binary_remote_addr zone=api_gateway:10m rate=50r/s;

    upstream gateway_upstream {
        server gateway:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream dashboard_upstream {
        server dashboard:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Health and Probe Endpoints (unbuffered, direct)
        location ~ ^/(health|healthz|readyz|livez|version) {
            proxy_pass http://gateway_upstream;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # 2. OpenAI-compatible Chat & Streaming Proxy (Buffering disabled for SSE)
        location /v1/chat/completions {
            limit_req zone=api_gateway burst=20 nodelay;

            proxy_pass http://gateway_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
        }

        # 3. Core API Routes
        location /api/ {
            limit_req zone=api_gateway burst=50 nodelay;
            proxy_pass http://gateway_upstream;
            proxy_read_timeout 60s;
        }

        # 4. Interactive Documentation (if enabled)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://gateway_upstream;
        }

        # 5. Frontend Dashboard Static Assets & SPA routing
        location / {
            proxy_pass http://dashboard_upstream;
            proxy_read_timeout 30s;
        }
    }
}
