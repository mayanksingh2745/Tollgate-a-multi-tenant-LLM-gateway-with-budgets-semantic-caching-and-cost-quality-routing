global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "tollgate-api"
    scrape_interval: 5s
    metrics_path: "/metrics"
    bearer_token: "tollgate-metrics-secret-token"
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          app: "tollgate"
          service: "tollgate-api"
          environment: "production"

  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
