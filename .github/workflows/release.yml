name: Release & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/tollgate

jobs:
  # -------------------------------------------------------
  # 1. Full CI — Lint, Type, Tests, Security
  # -------------------------------------------------------
  full-ci:
    name: Full CI Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate_ci_pass
          POSTGRES_DB: tollgate_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install ruff black mypy pytest pytest-asyncio httpx pgvector aiosqlite pip-audit
          pip install -e ".[dev]"
          pip install -e packages/core
          pip install -e apps/gateway
          pip install -e apps/worker

      - name: Code Formatting Check
        run: black --check apps/ packages/ tests/

      - name: Lint
        run: ruff check .

      - name: Type Check
        run: mypy packages/core/src apps/gateway/src apps/worker/src

      - name: Dependency Audit
        run: python -m pip_audit

      - name: Secret Scan
        run: python scripts/scan_secrets.py

      - name: Run Full Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://tollgate:tollgate_ci_pass@localhost:5432/tollgate_test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ --ignore=tests/test_benchmarks.py -q --tb=short

      - name: Migration Validation
        env:
          DATABASE_URL: postgresql+asyncpg://tollgate:tollgate_ci_pass@localhost:5432/tollgate_test_db
        run: pytest tests/test_migrations.py -v

  # -------------------------------------------------------
  # 2. Build Frontend
  # -------------------------------------------------------
  build-frontend:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package.json

      - name: Install & Build
        run: |
          cd apps/dashboard
          npm ci
          npm run build

  # -------------------------------------------------------
  # 3. Build & Push Container Images
  # -------------------------------------------------------
  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [full-ci, build-frontend]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      git_sha: ${{ github.sha }}
      git_sha_short: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Docker metadata (Worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

      - name: Docker metadata (Dashboard)
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & Push Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}

  # -------------------------------------------------------
  # 4. Deploy to Staging
  # -------------------------------------------------------
  staging-deploy:
    name: Staging Deployment & Smoke Tests
    runs-on: ubuntu-latest
    needs: build-images
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Staging Images (local for self-hosted)
        run: |
          export TOLLGATE_GIT_COMMIT=${{ needs.build-images.outputs.git_sha_short }}
          docker compose -f docker-compose.staging.yml build

      - name: Start Staging Stack
        run: |
          export TOLLGATE_GIT_COMMIT=${{ needs.build-images.outputs.git_sha_short }}
          docker compose -f docker-compose.staging.yml up -d
        timeout-minutes: 5

      - name: Wait for Staging Readiness
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8080/health/ready > /dev/null 2>&1; then
              echo "Staging gateway ready"
              break
            fi
            echo "  Attempt ${i}/30..."
            sleep 3
          done

      - name: Run Smoke Tests
        run: |
          chmod +x scripts/smoke_test.sh
          GATEWAY_URL=http://localhost:8080 bash scripts/smoke_test.sh

      - name: Verify Version
        run: |
          EXPECTED_SHA="${{ needs.build-images.outputs.git_sha_short }}"
          REPORTED=$(curl -s http://localhost:8080/health/version | python3 -c "import sys,json; print(json.load(sys.stdin).get('git_commit',''))")
          echo "Expected: ${EXPECTED_SHA}, Reported: ${REPORTED}"
          if [[ "${REPORTED}" != *"${EXPECTED_SHA}"* ]] && [[ "${REPORTED}" != "unknown" ]]; then
            echo "WARNING: Version mismatch (may be expected in local-build CI)"
          fi

      - name: Capture Logs on Failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --tail=100

      - name: Tear Down Staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v --remove-orphans

  # -------------------------------------------------------
  # 5. Production Deployment (manual approval)
  # -------------------------------------------------------
  production-deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: [staging-deploy, build-images]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://api.tollgate.ai' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Deploy to Production
        env:
          TOLLGATE_GIT_COMMIT: ${{ needs.build-images.outputs.git_sha_short }}
          TOLLGATE_VERSION: ${{ github.ref_name }}
          COMPOSE_FILE: docker-compose.prod.yml
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TOLLGATE_METRICS_TOKEN: ${{ secrets.TOLLGATE_METRICS_TOKEN }}
        run: |
          echo "Production deployment for commit: ${TOLLGATE_GIT_COMMIT}"
          # In a real deployment, this would SSH to the production host
          # or trigger a deployment via infrastructure tooling.
          # For Docker Compose deployments:
          # chmod +x scripts/deploy.sh
          # bash scripts/deploy.sh
          echo "BLOCKED — Production deployment requires external infrastructure."
          echo "Images are available at: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.build-images.outputs.git_sha_short }}"

      - name: Production Smoke Tests
        if: vars.PRODUCTION_URL != ''
        env:
          GATEWAY_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          chmod +x scripts/smoke_test.sh
          bash scripts/smoke_test.sh
