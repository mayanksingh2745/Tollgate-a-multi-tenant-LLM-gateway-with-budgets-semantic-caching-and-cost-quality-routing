name: Nightly Benchmarks

on:
  schedule:
    # Run at 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Performance Benchmark Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate_ci_pass
          POSTGRES_DB: tollgate_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pgvector aiosqlite
          pip install -e packages/core
          pip install -e apps/gateway
          pip install -e apps/worker

      - name: Run Benchmark Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://tollgate:tollgate_ci_pass@localhost:5432/tollgate_test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_benchmarks.py -v --tb=short 2>&1 | tee benchmark_results.txt

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results.txt
          retention-days: 30
