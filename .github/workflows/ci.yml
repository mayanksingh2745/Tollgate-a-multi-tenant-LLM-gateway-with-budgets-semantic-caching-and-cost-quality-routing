name: PR & Branch Validation

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master, feat/* ]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install pip-audit

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: python -m pip_audit

      - name: Run Repository Secret Scanner
        run: python scripts/scan_secrets.py

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -e ".[dev]"
          pip install -e packages/core
          pip install -e apps/gateway
          pip install -e apps/worker

      - name: Code Formatting Check (Black)
        run: black --check apps/ packages/ tests/

      - name: Lint with Ruff
        run: ruff check .

      - name: Type Check with mypy
        run: mypy packages/core/src apps/gateway/src apps/worker/src

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [security-audit, lint-and-typecheck]

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate_ci_pass
          POSTGRES_DB: tollgate_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pgvector aiosqlite
          pip install -e ".[dev]"
          pip install -e packages/core
          pip install -e apps/gateway
          pip install -e apps/worker

      - name: Run Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://tollgate:tollgate_ci_pass@localhost:5432/tollgate_test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ --ignore=tests/test_benchmarks.py -q --tb=short

      - name: Run Migration Chain Validation
        env:
          DATABASE_URL: postgresql+asyncpg://tollgate:tollgate_ci_pass@localhost:5432/tollgate_test_db
        run: pytest tests/test_migrations.py -v

  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    needs: [security-audit, lint-and-typecheck]

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate_ci_pass
          POSTGRES_DB: tollgate_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pgvector aiosqlite
          pip install -e ".[dev]"
          pip install -e packages/core
          pip install -e apps/gateway
          pip install -e apps/worker

      - name: Run Security Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://tollgate:tollgate_ci_pass@localhost:5432/tollgate_test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/security/ -v --tb=short

  frontend-build:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package.json

      - name: Install Dependencies
        run: |
          cd apps/dashboard
          npm ci

      - name: Build Dashboard
        run: |
          cd apps/dashboard
          npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [unit-tests, security-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: false
          tags: tollgate-api:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: tollgate-worker:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

  config-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose (dev)
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Docker Compose (staging)
        run: docker compose -f docker-compose.staging.yml config --quiet

      - name: Validate Docker Compose (prod)
        env:
          POSTGRES_PASSWORD: validate_only
          TOLLGATE_METRICS_TOKEN: validate_only
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate nginx config syntax
        run: |
          docker run --rm --add-host=gateway:127.0.0.1 --add-host=dashboard:127.0.0.1 -v $(pwd)/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t -c /etc/nginx/nginx.conf
