name: CI & Security Pipeline

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

# Least privilege: default all jobs to read-only content access
permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: python -m pip_audit

      - name: Run Repository Secret Scanner
        run: python scripts/scan_secrets.py

  lint-and-test:
    name: Lint, Type Check & Security Test Suite
    runs-on: ubuntu-latest
    needs: security-audit

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate_secret_pass
          POSTGRES_DB: tollgate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-asyncio httpx pgvector aiosqlite
          pip install -e packages/core
          pip install -e apps/gateway
          pip install -e apps/worker

      - name: Code Formatting Check (Black)
        run: black --check apps/ packages/ tests/

      - name: Lint with Ruff
        run: ruff check .

      - name: Type Check with mypy
        run: mypy apps/ packages/

      - name: Run Pytest & Security Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://tollgate:tollgate_secret_pass@localhost:5432/tollgate_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  build-docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: false

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false

  build-dashboard:
    name: Build React Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package.json

      - name: Install & Build
        run: |
          cd apps/dashboard
          npm ci
          npm run build
