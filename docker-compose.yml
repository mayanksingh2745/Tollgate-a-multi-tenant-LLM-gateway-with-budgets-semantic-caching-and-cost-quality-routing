services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: tollgate-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tollgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tollgate_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tollgate_db}
    # Bound to loopback only to prevent public network exposure
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tollgate-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tollgate} -d ${POSTGRES_DB:-tollgate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tollgate-redis
    restart: always
    # Bound to loopback only to prevent public network exposure
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tollgate-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: tollgate-gateway
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      POSTGRES_USER: ${POSTGRES_USER:-tollgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tollgate_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tollgate_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tollgate}:${POSTGRES_PASSWORD:-tollgate_secret_pass}@postgres:5432/${POSTGRES_DB:-tollgate_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      TOLLGATE_OTEL_ENABLED: ${TOLLGATE_OTEL_ENABLED:-true}
      TOLLGATE_OTEL_ENDPOINT: ${TOLLGATE_OTEL_ENDPOINT:-http://jaeger:4318}
      TOLLGATE_OTEL_SERVICE_NAME: tollgate-api
      TOLLGATE_OTEL_TRACE_SAMPLE_RATE: ${TOLLGATE_OTEL_TRACE_SAMPLE_RATE:-1.0}
      TOLLGATE_METRICS_ENABLED: ${TOLLGATE_METRICS_ENABLED:-true}
      TOLLGATE_METRICS_AUTH_ENABLED: ${TOLLGATE_METRICS_AUTH_ENABLED:-true}
      TOLLGATE_METRICS_TOKEN: ${TOLLGATE_METRICS_TOKEN:-tollgate-metrics-secret-token}
      TOLLGATE_CORS_ALLOWED_ORIGINS: ${TOLLGATE_CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - tollgate-frontend
      - tollgate-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: tollgate-worker
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tollgate}:${POSTGRES_PASSWORD:-tollgate_secret_pass}@postgres:5432/${POSTGRES_DB:-tollgate_db}
      TOLLGATE_USAGE_STREAM: ${TOLLGATE_USAGE_STREAM:-tg:usage:events}
      TOLLGATE_USAGE_CONSUMER_GROUP: ${TOLLGATE_USAGE_CONSUMER_GROUP:-tg-usage-workers}
      TOLLGATE_USAGE_DEAD_LETTER_STREAM: ${TOLLGATE_USAGE_DEAD_LETTER_STREAM:-tg:usage:dead-letter}
      TOLLGATE_OTEL_ENABLED: ${TOLLGATE_OTEL_ENABLED:-true}
      TOLLGATE_OTEL_ENDPOINT: ${TOLLGATE_OTEL_ENDPOINT:-http://jaeger:4318}
      TOLLGATE_OTEL_SERVICE_NAME: tollgate-worker
      TOLLGATE_OTEL_TRACE_SAMPLE_RATE: ${TOLLGATE_OTEL_TRACE_SAMPLE_RATE:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - tollgate-backend

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: tollgate-jaeger
    restart: always
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - tollgate-backend
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tollgate-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - tollgate-backend

  grafana:
    image: grafana/grafana:10.4.1
    container_name: tollgate-grafana
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=tollgate_admin_pass
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - tollgate-backend

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: tollgate-dashboard
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - tollgate-frontend

networks:
  tollgate-frontend:
    driver: bridge
  tollgate-backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
